name: Cross-Platform Build (maggie_xp)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: maggie_xp-linux
            binary: maggie_xp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: maggie_xp-windows
            binary: maggie_xp.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: maggie_xp-macos-arm64
            binary: maggie_xp

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Build cross-platform binary
        run: cargo build --release --bin maggie_xp --no-default-features --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v7

      - name: Create release directory
        run: mkdir -p release-files incoming

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: incoming

      - name: Package release archives
        run: |
          cd incoming

          # Linux
          tar -czf ../release-files/maggie_xp-linux-x86_64.tar.gz \
            -C maggie_xp-linux maggie_xp

          # Windows (zip for Windows users)
          cd maggie_xp-windows
          7z a ../../release-files/maggie_xp-windows-x86_64.zip maggie_xp.exe
          cd ..

          # macOS
          tar -czf ../release-files/maggie_xp-macos-arm64.tar.gz \
            -C maggie_xp-macos-arm64 maggie_xp

          # Checksums
          cd ../release-files
          sha256sum * > checksums.txt

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
