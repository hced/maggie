name: Linux CI/CD

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libegl1-mesa-dev pkg-config

      - name: Build native Wayland binary
        run: cargo build --release --verbose

      - name: Build cross-platform binary
        run: cargo build --release --bin maggie_xp --no-default-features --verbose

      - name: Run tests
        run: cargo test --release --verbose

      - name: Upload native binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: maggie-linux
          path: target/release/maggie
          if-no-files-found: error

      - name: Upload cross-platform binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: maggie_xp-linux
          path: target/release/maggie_xp
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v6

      - name: Create release directory structure
        run: mkdir -p incoming release-files

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Package artifacts for release
        run: |
          cd incoming
          if [ -d maggie-linux ]; then
            tar -czf ../release-files/maggie-linux.tar.gz -C maggie-linux maggie
          fi
          if [ -d maggie_xp-linux ]; then
            tar -czf ../release-files/maggie_xp-linux-x86_64.tar.gz -C maggie_xp-linux maggie_xp
          fi
          cd ../release-files
          sha256sum * > checksums.txt

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
