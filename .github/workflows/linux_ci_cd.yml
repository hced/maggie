name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libegl1-mesa-dev pkg-config

      - name: Build native Wayland binary
        run: cargo build --release --verbose

      - name: Build cross-platform binary
        run: cargo build --release --bin maggie_xp --no-default-features --verbose

      - name: Run tests
        run: cargo test --release --verbose
