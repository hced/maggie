name: Linux CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libegl1-mesa-dev pkg-config

      - name: Build native Wayland binary
        run: cargo build --release --verbose

      - name: Build cross-platform binary
        run: cargo build --release --bin maggie_xp --no-default-features --verbose

      - name: Run tests
        run: cargo test --release --verbose

      - name: Upload native binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: maggie-linux
          path: target/release/maggie
          if-no-files-found: error

      - name: Upload cross-platform binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: maggie_xp-linux-ci
          path: target/release/maggie_xp
          if-no-files-found: error
