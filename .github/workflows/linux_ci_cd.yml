name: Linux CI/CD

# -----------------------------------------------------------------------------
# RUNNER TRIGGER LOGIC:
# Mirrors zummon: the workflow only triggers on tag pushes (e.g., v0.1.0).
# Standard pushes to the main branch or pull requests will NOT wake up the
# runners, ensuring we don't waste CI compilation minutes on routine
# development tasks.
# -----------------------------------------------------------------------------
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

# Need to grant write permissions for the Release step to move compiled binaries into Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libegl1-mesa-dev pkg-config

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --release --verbose

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: maggie-ubuntu-latest
          path: target/release/maggie
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v6

      - name: Create release directory structure
        run: |
          mkdir -p ${{ github.workspace }}/incoming
          mkdir -p ${{ github.workspace }}/release-files

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: maggie-ubuntu-latest
          path: ${{ github.workspace }}/incoming/linux

      - name: Package artifacts for release
        run: |
          cd ${{ github.workspace }}/incoming

          # Package Linux binary
          if [ -f "linux/maggie" ]; then
            tar -czf ${{ github.workspace }}/release-files/maggie-linux.tar.gz -C linux maggie
          fi

          # Generate checksums
          cd ${{ github.workspace }}/release-files
          sha256sum * > checksums.txt

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
