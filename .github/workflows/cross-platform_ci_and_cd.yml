name: Cross-Platform CI/CD

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            rustflags: "-C target-cpu=x86-64-v3"
          - os: windows-latest
            platform: windows
            rustflags: "-C target-cpu=x86-64-v3"
          - os: macos-latest
            platform: macos
            rustflags: ""
    runs-on: ${{ matrix.os }}

    env:
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --bin maggie_xp --no-default-features --verbose

      - name: Run tests
        run: cargo test --release --verbose

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: maggie_xp-${{ matrix.platform }}
          path: |
            target/release/maggie_xp
            target/release/maggie_xp.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v7

      - name: Create release directory structure
        run: |
          mkdir -p ${{ github.workspace }}/incoming
          mkdir -p ${{ github.workspace }}/release-files

      - name: Download Linux Artifact
        uses: actions/download-artifact@v8
        with:
          name: maggie_xp-linux
          path: ${{ github.workspace }}/incoming/linux

      - name: Download macOS Artifact
        uses: actions/download-artifact@v8
        with:
          name: maggie_xp-macos
          path: ${{ github.workspace }}/incoming/macos

      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: maggie_xp-windows
          path: ${{ github.workspace }}/incoming/windows

      - name: Package artifacts for release
        run: |
          cd ${{ github.workspace }}/incoming

          if [ -f "linux/maggie_xp" ]; then
            tar -czf ${{ github.workspace }}/release-files/maggie-linux.tar.gz -C linux maggie_xp
          fi

          if [ -f "macos/maggie_xp" ]; then
            tar -czf ${{ github.workspace }}/release-files/maggie-macos.tar.gz -C macos maggie_xp
          fi

          if [ -f "windows/maggie_xp.exe" ]; then
            zip -j ${{ github.workspace }}/release-files/maggie-windows.zip windows/maggie_xp.exe
          fi

          cd ${{ github.workspace }}/release-files
          sha256sum * > checksums.txt

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
