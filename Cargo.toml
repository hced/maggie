[package]
name = "maggie"
version = "0.1.2"
edition = "2024"

[dependencies]
wayland-client = { version = "0.31", features = ["log"] }
xcursor = "0.3"
smithay-client-toolkit = "0.21"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-egl = "0.32"
khronos-egl = { version = "6.0.0", features = ["dynamic", "1_5"] }
clap = { version = "4.5", features = ["derive"] }
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
dirs = "5.0"
memmap2 = "0.9"
png = "0.18"
egui = "0.35"
egui_glow = "0.35"
glow = "0.17"
egui-file-dialog = "0.14.1"

[build-dependencies]
gl_generator = "0.14"
